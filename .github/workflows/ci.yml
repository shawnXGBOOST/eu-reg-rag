name: CI

on: [push, pull_request]

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU-only PyTorch: ~200 MB instead of ~2 GB of CUDA wheels
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  retrieval-eval:
    name: Retrieval quality gate (Hit@5 >= 0.90)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/eu_reg_rag/config.py') }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - name: Build the index from the committed chunks
        run: python -m eu_reg_rag.index
      - name: Evaluate retrieval on 47 labelled questions
        run: |
          python -m eu_reg_rag.evaluate \
            --configs "BM25" "Dense" "Hybrid (RRF)" "Hybrid, articles-first" \
                      "Hybrid, articles-first, 1 per article" \
            --min-hit5 0.90 --out eval/results_ci.md
      - name: Publish results to the run summary
        if: always()
        run: cat eval/results_ci.md >> "$GITHUB_STEP_SUMMARY"
